function getBdayNum(m, d) {
    let mn = N2M[m];
    if(!mn) return null;
    let s = M_START[mn];
    return ((s-1+d-1)%260)+1;
}

function getYearNum(y) {
    if(Y_TABLE[y] !== undefined) return Y_TABLE[y];
    if(y < 1912) {
        let c = Y_TABLE[1954];
        for(let yy=1953; yy>=y; yy--) {
            let leap = (yy%4===0 && yy%100!==0) || (yy%400===0);
            c = ((c-105-(leap?1:0)-1+260)%260)+1;
        }
        return c;
    }
    if(y > 2051) {
        let c = Y_TABLE[2051];
        for(let yy=2052; yy<=y; yy++) {
            let leap = (yy%4===0 && yy%100!==0) || (yy%400===0);
            c = ((c+105+(leap?1:0)-1)%260)+1;
        }
        return c;
    }
    return null;
}

function doCalculate() {
    let month = parseInt(document.getElementById('month').value);
    let day = parseInt(document.getElementById('day').value);
    let year = parseInt(document.getElementById('year').value);
    let bt = document.getElementById('birthTime').value.trim();

    if(!month || !day || !year) {
        alert('请填写月份、日期和年份！');
        return;
    }

    let adjYear = year;
    let adjMonth = month;
    let adjDay = day;
    let yrAdj = false;
    let tmAdj = false;

    if(month===1 || month===2) {
        adjYear = year-1;
        yrAdj = true;
    }

    if(bt) {
        let parts = bt.split(':');
        if(parts.length < 2) parts = bt.split('.');
        let h = parseInt(parts[0]);
        let min = parseInt(parts[1]||0);
        if(h<5 || (h===5 && min<30)) {
            adjDay = day-1;
            tmAdj = true;
            if(adjDay<1) {
                adjMonth = month-1;
                if(adjMonth<1) { adjMonth=12; adjYear-=1; }
                adjDay = M_DAYS[N2M[adjMonth]];
            }
        }
    }

    let bday = getBdayNum(adjMonth, adjDay);
    let ynum = getYearNum(adjYear);

    if(bday===null || ynum===null) {
        alert('数据有误！');
        return;
    }

    let total = bday + ynum;
    let kin = total;
    if(kin>260) kin -= 260;

    let sealN = ((kin-1)%20)+1;
    let toneN = ((kin-1)%13)+1;
    let s = SEALS[sealN];
    let t = TONES[toneN];

    document.getElementById('outKin').textContent = 'KIN ' + kin;
    document.getElementById('outSeal').innerHTML = s[2] + ' · ' + s[1] + ' · 调性' + toneN + ' ' + t[0];

    document.getElementById('outTone').innerHTML = 
        '<b>玛雅文：</b>' + t[1] + '<br>' +
        '<b>关键词：</b>' + t[2] + '<br>' +
        '<b>英文：</b>' + t[3] + '<br>' +
        '<b>星象动物：</b>' + t[4] + '<br><br>' + t[5];

    document.getElementById('outSealText').innerHTML = 
        '<b>方向·元素：</b>' + s[3] + ' · ' + s[4] + '<br>' +
        '<b>核心含义：</b>' + s[5] + '<br><br>' + s[6];

    let steps = '1. 查表1：' + N2M[adjMonth] + adjDay + '日 → 生日数字 = ' + bday + '<br>';
    steps += '2. 查表2：' + adjYear + '年 → 年份数字 = ' + ynum;
    if(yrAdj) steps += '（' + month + '月出生，年份减一）';
    steps += '<br>3. 合计：' + bday + '+' + ynum + '=' + total;
    if(total>260) steps += ' >260 减260=' + kin;
    else steps += '=' + kin;
    steps += '<br>4. KIN' + kin + ' → 印记' + sealN + '(' + s[0] + ' ' + s[2] + ') + 调性' + toneN + '(' + t[0] + ')';
    if(tmAdj) steps += '<br>⚠️ 出生时间' + bt + '（5:30前），日期调整为' + N2M[adjMonth] + adjDay + '日';
    document.getElementById('outSteps').innerHTML = steps;

    document.getElementById('resultBox').classList.add('show');
}
